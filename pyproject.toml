[project]
name = "ed-decision-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "laya>=0.3,<0.4",
    "laya-mlx>=0.2.0",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
# The environment is built and run on the project Mac (Apple Silicon). Resolution is limited to that platform.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
